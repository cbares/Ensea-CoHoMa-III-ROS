# Speeds of the joystick teleoperation (launch/teleop.launch.py). The buttons and axes
# come from the teleop_twist_joy preset. Limits of the controller: 1.5 m/s, 4 rad/s.
teleop_twist_joy_node:
  ros__parameters:
    publish_stamped_twist: true  # twist_mux use_stamped
    frame: base_footprint
    require_enable_button: true
    scale_linear:
      x: 0.5   # m/s
    scale_linear_turbo:
      x: 1.5
    scale_angular:
      yaw: 1.5  # rad/s
    scale_angular_turbo:
      yaw: 4.0
