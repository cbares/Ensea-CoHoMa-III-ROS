name: modelibot

# Containers of the robot. From the root of the repository:
#   docker compose -f docker/compose.yaml up -d --build      # router, base, IMU, lidar
#   docker compose -f docker/compose.yaml --profile gps up -d  # + GPS server
# Settings: docker/.env (copy env.example).
# The lidar alone (other robot): docker compose -f Lslidar_ROS2_driver/docker-compose.yaml up

# ROS settings shared by every container of the robot.
# Zenoh: the nodes talk through the router of the host (zenoh_router, tcp/localhost:7447).
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${_ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: rmw_zenoh_cpp

services:
  # One per host, started first: without it the nodes of the containers do not see each other.
  zenoh_router:
    image: ros_modelibot
    pull_policy: never  # built by modelibot_container
    environment: *ros-env
    network_mode: "host"
    ipc: "host"
    user: $_ROS_USER
    restart: unless-stopped
    command: ros2 run rmw_zenoh_cpp rmw_zenohd

  # Base (ros2_control), robot description, twist_mux, RViz. Also the dev container.
  modelibot_container:
    image: ros_modelibot
    build:
      context: ../
      additional_contexts:
        src: ../modelidar
        mpu9250: ../mpu9250_ROS2_driver
      dockerfile: docker/Dockerfile
      args:
        USERNAME: ${_ROS_USER:?Please set an .env file with _ROS_USER}
    depends_on:
      - zenoh_router
    privileged: true
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
      # GNOME/Wayland: Xwayland's cookie is in /run/user/<uid> (mounted below), with a new
      # name at each login: rebuild/recreate the container after logging in again.
      XAUTHORITY: ${XAUTHORITY:-/home/$_ROS_USER/.Xauthority}
      XDG_RUNTIME_DIR: /run/user/${UID:-1000}
    volumes:
      - ../modelidar:/home/$_ROS_USER/ws/src/modelidar:cached
      - ../mpu9250_ROS2_driver:/home/$_ROS_USER/ws/src/mpu9250_ROS2_driver:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:cached
      - /dev/dri:/dev/dri:cached
      - ~/.Xauthority:/home/$_ROS_USER/.Xauthority
      - /dev/input:/dev/input:bind
      - /dev:/dev:bind
      - /run/user/${UID:-1000}:/run/user/${UID:-1000}
      # Claude Code: same login, settings and memory as on the host
      - ~/.claude:/home/$_ROS_USER/.claude
      - ~/.claude.json:/home/$_ROS_USER/.claude.json

    network_mode: "host"
    ipc: "host"
    pid: "host"
    user: $_ROS_USER
    tty: true
    #command: "ros2 launch modelidar modelidar.launch.py use_mock_hardware:=true gui:=false"

  # IMU MPU9250 on I2C bus 1. Calibrates at start: the robot must stay still and flat.
  imu_container:
    image: ros_modelibot
    pull_policy: never  # built by modelibot_container
    depends_on:
      - zenoh_router
    environment: *ros-env
    volumes:
      # the workspace is built with --symlink-install: launch and config files live in src
      - ../modelidar:/home/$_ROS_USER/ws/src/modelidar:ro
      - ../mpu9250_ROS2_driver:/home/$_ROS_USER/ws/src/mpu9250_ROS2_driver:ro
      - /dev:/dev:bind
    privileged: true
    network_mode: "host"
    ipc: "host"
    user: $_ROS_USER
    # /dev/i2c-* belong to the host's i2c group, whose id differs between hosts
    # (getent group i2c): set _I2C_GID in .env.
    group_add:
      - "${_I2C_GID:-164}"
    restart: unless-stopped
    # The C++ node directly, without `ros2 launch` (Python: slow to start on the Pi, and
    # stays in memory). __node: the name used as key in mpu9250.yaml.
    command: >-
      /home/${_ROS_USER}/ws/install/mpu9250driver/lib/mpu9250driver/mpu9250driver
      --ros-args -r __node:=mpu9250driver_node
      --params-file /home/${_ROS_USER}/ws/install/modelidar/share/modelidar/config/mpu9250.yaml

  # Lidar: defined in its own repository, which can also run it alone (tests with other
  # robots). Here it uses the robot's router and settings.
  lslidar_container:
    extends:
      file: ../Lslidar_ROS2_driver/docker-compose.yaml
      service: lslidar_container
    depends_on:
      - zenoh_router
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp

  # GPS (gpsd, RTK): only with --profile gps.
  gpsd_server_container:
    image: gps_server_modelibot
    profiles: [gps]
    build:
      context: ../
      dockerfile: docker/Dockerfile.gpsd
      args:
        USERNAME: ${_ROS_USER:?Please set an .env file with _ROS_USER}
    depends_on:
      - zenoh_router
    privileged: true
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ../:/home/$_ROS_USER/ws/src:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:cached
      - /dev/dri:/dev/dri:cached
      - ~/.Xauthority:/home/$_ROS_USER/.Xauthority
      - /dev/input:/dev/input:bind
      - /dev:/dev:bind
      - /run/user/${UID:-1000}:/run/user/${UID:-1000}
    network_mode: "host"
    ipc: "host"
    pid: "host"
    user: $_ROS_USER
    tty: true
    restart: unless-stopped

  # SBUS -> PWM (send_udp), not finished: see Dockerfile.sbus_pwm.
  # ros_sbus:
  #   image: sbus_pwm_modelibot
  #   profiles: [sbus]
  #   build:
  #     context: ../
  #     dockerfile: docker/Dockerfile.sbus_pwm
  #     args:
  #       USERNAME: ${_ROS_USER:?Please set an .env file with _ROS_USER}
  #   depends_on:
  #     - zenoh_router
  #   privileged: true
  #   environment: *ros-env
  #   volumes:
  #     - /dev:/dev:bind
  #   network_mode: "host"
  #   ipc: "host"
  #   user: $_ROS_USER
  #   restart: unless-stopped
